name: benign_reads_under_cap
kind: benign
description: Two reads under a max_calls=3 session cap stay allowed.
setup:
  grants:
    - tool: db
      operation: read
      resource_pattern: "db://customers/123/*"
      constraints:
        max_calls: 3
steps:
  - action: call
    tool: db
    operation: read
    resource: "db://customers/123/profile"
    expect:
      action: allow
  - action: call
    tool: db
    operation: read
    resource: "db://customers/123/profile"
    expect:
      action: allow
expect:
  action: allow
