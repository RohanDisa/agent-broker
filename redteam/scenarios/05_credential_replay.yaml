name: credential_replay
kind: attack
description: Capture a minted credential and present it twice.
setup:
  grants:
    - tool: db
      operation: read
      resource_pattern: "db://customers/123/*"
steps:
  - action: call
    tool: db
    operation: read
    resource: "db://customers/123/profile"
    provenance:
      source: user
    expect:
      action: allow
  - action: call
    tool: db
    operation: read
    resource: "db://customers/123/profile"
    use_last_credential: true
    expect:
      action: deny
      control: single_use
expect:
  action: deny
  control: single_use
ablation:
  disable: [single_use]
  expect_action: allow
